syntax = "proto3";

package miniquorum;

option go_package = "miniquorum/proto;raftpb";

message Message {
  uint64 from = 1;
  uint64 to = 2;
  uint64 term = 3;
  oneof body {
    RequestVoteReq request_vote = 4;
    RequestVoteResp request_vote_resp = 5;
    AppendEntriesReq append_entries = 6;
    AppendEntriesResp append_entries_resp = 7;
    InstallSnapshotChunk install_snapshot = 8;
    InstallSnapshotResp install_snapshot_resp = 9;
  }
}

message RequestVoteReq {
  uint64 term = 1;
  uint64 candidateId = 2;
  uint64 lastLogIndex = 3;
  uint64 lastLogTerm = 4;
}

message RequestVoteResp {
  uint64 term = 1;
  bool voteGranted = 2;
}

message AppendEntriesReq {
  uint64 term = 1;
  uint64 leaderId = 2;
  uint64 prevLogIndex = 3;
  uint64 prevLogTerm = 4;
  repeated Entry entries = 5;
  uint64 leaderCommit = 6;
}

message AppendEntriesResp {
  uint64 term = 1;
  bool success = 2;
}

message InstallSnapshotChunk {
  uint64 term = 1;
  uint64 leaderId = 2;
  uint64 lastIncludedIndex = 3;
  uint64 lastIncludedTerm = 4;
  uint64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message InstallSnapshotResp {
  uint64 term = 1;
}

message Entry {
  uint64 index = 1;
  uint64 term = 2;
  EntryType type = 3;
  bytes data = 4;
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  NORMAL = 1;
  NOOP = 2;
}

service Raft {
  rpc Send(Message) returns (SendResp);
}

message SendResp {}
