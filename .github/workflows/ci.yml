name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Generated corpus reproducibility preflight
        run: go test ./internal/simharness -run '^TestCommittedGeneratedCorpusMatchesGeneratorOutput$' -count=1
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10.1
      - name: Race tests
        run: make test
      - name: Phase 1 500-seed simulator corpus
        run: make sim-500
      - name: Raft determinism boundary
        run: make boundary

  sim-1000:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: 1,000-seed full-fault Porcupine gate
        run: make sim-1k
      - name: Committed corpus replay gate
        run: make corpus
      - name: Upload failure artifacts (seed, schedule, history, visualization)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-1000-failure-artifacts
          path: sim-artifacts/
          if-no-files-found: ignore
