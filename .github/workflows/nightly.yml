name: Nightly

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  # The 10,000-seed Phase 4 gate: full fault model, full PUT/GET/DELETE
  # histories, zero linearizability violations. Seeds are independent, so the
  # run is sharded across GitHub-hosted runners; within each shard cmd/simrun
  # bounds parallelism to the runner's cores and aggregates in seed order.
  sim-10000:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: 2,500-seed shard of the 10,000-seed gate
        run: go run ./cmd/simrun -start $((1 + ${{ matrix.shard }} * 2500)) -count 2500
      - name: Upload failure artifacts (seed, schedule, history, visualization)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-shard-${{ matrix.shard }}-failure-artifacts
          path: sim-artifacts/
          if-no-files-found: ignore

  # The negative control: the committed pinned schedule must FAIL Porcupine
  # when the section 5.4.2 commit-by-count bug is compiled in via -tags buggy.
  # A checker that cannot fail is not evidence.
  negative-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Pinned schedule fails Porcupine under -tags buggy
        run: make negative-control
      - name: Pinned CLI replay reports the violation deterministically
        run: |
          seed="$(jq -r '.pinned.seed' corpus/manifest.json)"
          schedule="corpus/$(jq -r '.pinned.schedule' corpus/manifest.json)"
          if go run -tags buggy ./cmd/simreplay -seed "$seed" -schedule "$schedule" -out /tmp/negative-control; then
            echo "buggy replay unexpectedly passed the pinned schedule" >&2
            exit 1
          fi
          grep -q '"checker_ran": true' /tmp/negative-control/summary.json
          grep -q '"linearizable": false' /tmp/negative-control/summary.json
          test -s /tmp/negative-control/porcupine.html
